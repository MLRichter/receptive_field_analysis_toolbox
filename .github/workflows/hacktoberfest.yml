name: Hacktoberfest

on:
  schedule:
    # Run every day in October
    - cron: "0 0 * 10 *"
    # Run on the 1st of November to revert
    - cron: "0 13 1 11 *"

jobs:
  hacktoberfest:
    runs-on: ubuntu-latest

    steps:
      - uses: browniebroke/hacktoberfest-labeler-action@26aef1a8012ea050fbc939d250e07b27a344b28b # v2.2.0
        with:
          github_token: ${{ secrets.GH_PAT }}
